<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact SKROL — Screen Time &amp; Reels Tracker Support</title>
  <meta name="description" content="Contact the SKROL team for support, iOS TestFlight beta access, or partnership inquiries. hello@skrol.in">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://skrol.in/contact.html">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .contact-page { padding: 120px 0 80px; text-align: center; }
    .contact-page img { width: 64px; border-radius: 16px; margin: 0 auto 20px; }
    .contact-page h1 { font-size: 2rem; margin-bottom: 8px; }
    .contact-page p { color: var(--text-muted); margin-bottom: 24px; }
    .contact-email {
      display: inline-block;
      padding: 16px 32px;
      background: var(--gold-dim);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 100px;
      color: var(--gold);
      font-weight: 700;
      font-size: 1.1rem;
    }
    .back { color: var(--gold); font-size: 0.9rem; display: inline-block; margin-bottom: 40px; }
  </style>
</head>
<body>
  <div class="contact-page container">
    <a href="/" class="back">← Back to SKROL</a>
    <img src="assets/favicon.png" alt="SKROL" width="64" height="64">
    <h1>Contact SKROL</h1>
    <p>Questions, feedback, or support — we'd love to hear from you.</p>
    <a href="mailto:hello@skrol.in" class="contact-email">hello@skrol.in</a>
    <p style="margin-top:48px;font-size:0.85rem">https://skrol.in</p>
  </div>
</body>
</html>
