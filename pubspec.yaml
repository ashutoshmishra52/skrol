name: skrol
description: "Track Less. Live More. — Premium short-form content tracking by SKROL."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # UI & Animations
  flutter_animate: ^4.5.2
  lottie: ^3.1.3
  fl_chart: ^0.69.2
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3

  # Platform Services
  usage_stats: ^1.3.1
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  home_widget: ^0.7.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.3
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0A1628"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0E0E12"
  android_12:
    color: "#0E0E12"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/lottie/
    - assets/images/
